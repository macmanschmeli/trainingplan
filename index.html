<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0b0c0f">
<title>Südstadt volleyteam — Trainingsplan</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="noise" aria-hidden="true"></div>
<main class="wrap">
  <section class="controls reveal" aria-label="Trainings filtern">
    <div class="filter-block"><div class="filter-label">Nach Team filtern</div><div class="chips" id="chips"></div></div>
    <div class="select-wrap"><label id="hall-label" for="hall">Halle</label><select id="hall"><option value="all">Alle Hallen</option></select></div>
  </section>
  <div class="week-head reveal"><h2 id="week-title">Deine Woche</h2><small id="result-count" aria-live="polite"></small></div>
  <section class="schedule" id="schedule" aria-label="Wöchentlicher Trainingsplan"></section>
  <p class="empty" id="load-error" role="alert" hidden>Der Trainingsplan konnte nicht geladen werden. Bitte lade die Seite neu oder überprüfe die config.json.</p>
</main>
<script src="app.js" defer></script>
</body>
</html>
